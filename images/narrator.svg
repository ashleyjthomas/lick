<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- shoulders / body -->
  <path d="M 30 260 L 30 200 C 60 175, 140 175, 170 200 L 170 260 Z"
        fill="#ffffff" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <!-- collar v -->
  <path d="M 86 178 L 100 196 L 114 178" fill="none" stroke="#222" stroke-width="3"/>
  <!-- neck -->
  <rect x="88" y="158" width="24" height="22" fill="#ffffff" stroke="#222" stroke-width="4"/>
  <!-- head -->
  <ellipse cx="100" cy="105" rx="55" ry="60" fill="#ffffff" stroke="#222" stroke-width="4"/>
  <!-- ears -->
  <ellipse cx="46" cy="110" rx="6" ry="10" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <ellipse cx="154" cy="110" rx="6" ry="10" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- hair: short bob with bangs -->
  <path d="M 47 95 C 45 55, 80 32, 100 38 C 122 32, 158 55, 153 100
           L 148 80 C 130 70, 112 70, 100 78
           C 88 70, 70 70, 52 80 Z"
        fill="#ffffff" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <!-- glasses -->
  <rect x="68" y="92" width="28" height="20" fill="#ffffff" stroke="#222" stroke-width="2.8" rx="5"/>
  <rect x="104" y="92" width="28" height="20" fill="#ffffff" stroke="#222" stroke-width="2.8" rx="5"/>
  <line x1="96" y1="102" x2="104" y2="102" stroke="#222" stroke-width="2.8"/>
  <!-- eyes -->
  <circle cx="82" cy="102" r="3.5" fill="#222"/>
  <circle cx="118" cy="102" r="3.5" fill="#222"/>
  <!-- cheeks -->
  <circle cx="66" cy="128" r="5" fill="#f9c6c6" opacity="0.6"/>
  <circle cx="134" cy="128" r="5" fill="#f9c6c6" opacity="0.6"/>
  <!-- smile -->
  <path d="M 78 132 Q 100 152, 122 132" fill="none" stroke="#222" stroke-width="3"
        stroke-linecap="round"/>
  <!-- speech-bubble hint (tiny dot+wave) -->
  <circle cx="175" cy="65" r="3" fill="#56ab2f" opacity="0.6"/>
  <path d="M 168 50 Q 175 38, 185 45" stroke="#56ab2f" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.55"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Knowledge, Consent, and Sharing</title>

    <!-- jsPsych 7.3.4 core + plugins, loaded from CDN -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css">
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
</head>
<body></body>
<script>
/* =============================================================
   LICK-4 — THE GAME (hosted on GitHub Pages)
   =============================================================
   This is what children actually play. It is opened in a second
   tab by the CHS shell (chs_shell.js), which handles consent and
   webcam recording and passes ?pid= and ?chsid= through:

       https://ashleyjthomas.github.io/lick/?pid=...&chsid=...

   Responses are posted to the "Lick Study 4" Google Sheet (see
   scripts/apps_script.gs) — one row per child, re-posted after
   every trial so a session that stops early still leaves data.
   When the study ends it postMessages GAME_COMPLETE back to the
   CHS tab so recording can stop.

   It also runs standalone for piloting: open it with no ?pid= and
   it invents a LOCAL_<timestamp> id. See RESEARCHER OPTIONS below
   for the ?dev=1 / ?trial=N / ?rel= switches.

   experiment.js is the older all-in-CHS version, which runs the
   whole study inside CHS and does not use the Sheet. Use one or
   the other, not both.
   ============================================================= */

const jsPsych = initJsPsych({
    // Re-post the (growing) wide row at the end of every trial, so a child who
    // quits partway still leaves data behind. The Apps Script upserts on
    // participantId, so the sheet keeps exactly one row per child.
    on_trial_finish: function(data) {
        if (data && data.name === 'pie_slice_feedback') SHEETS.post();
    },
    on_finish: function() {
        SHEETS.post({ final: true });
        SHEETS.notifyOpener();          // tells the CHS tab the game is done
        if (DEV.dev) jsPsych.data.displayData();
    }
});
const timeline = [];

// === DATA UPLOAD (Google Sheets) ===============================
// Mirrors the RELKIND setup: the CHS study is a shell that records webcam and
// opens this game in a second tab with ?pid= and ?chsid=; the game posts its
// own data to a Google Sheet and postMessages back when finished.
// See scripts/apps_script.gs for the receiver and its deployment steps.
const SHEETS = (function() {

    function urlParam(names) {
        try {
            const p = new URLSearchParams(window.location.search);
            for (const k of names) {
                const v = p.get(k);
                if (v && v.trim()) return v.trim();
            }
        } catch (e) {}
        return '';
    }

    // CHS opens the game with ?pid=<condition>_<timestamp>&chsid=<response_uuid>.
    // Aliases accepted in case the platform renames them later.
    const PID = urlParam(['pid','participantId','participant_id','child_id','subject_id'])
                || ('LOCAL_' + Date.now());
    const CHS = urlParam(['chsid','chsId','chs_id','response_uuid','responseUuid','session_id']);

    // Web App URL from the Apps Script deployment (see scripts/apps_script.gs).
    // Set to '' or 'PASTE_ME' to disable upload; the CSV fallback still works.
    const SHEETS_WEBHOOK = 'https://script.google.com/macros/s/AKfycbz_OjC5tX2Ksj8UWRH4Pwnd5lATM1V98pZcv0fZVeXFg3gZSDAO8bq02y7fPt2aHPq3lQ/exec';

    const NTRIALS = 6;
    const PER_TRIAL = ['condition','consent','relation','protagonist',
                       'memory','memory_rt',
                       'okay','okay_rt','okayCert','okayCertLabel',
                       'protagInference','protagCert','protagCertLabel',
                       'replays'];

    const COLS = ['study','participantId','chsId','firstName','childAge',
                  'relationCondition',
                  'startedAt','finishedAt','nTrialsCompleted',
                  'attentionAnswer','attentionCorrect','attentionAttempts',
                  'audioFailures',
                  'userAgent']
        .concat(...Array.from({ length: NTRIALS }, (_, i) =>
            PER_TRIAL.map(f => `t${i + 1}_${f}`)));

    const startedAt = new Date().toISOString();

    // Pull one field out of a named trial for a given run_index. Defaults to
    // chosen_value (the semantic answer) rather than response (a button index).
    function pick(rows, name, runIndex, field) {
        const hit = rows.find(r => r.name === name && r.run_index === runIndex);
        if (!hit) return '';
        const v = hit[field || 'chosen_value'];
        return v === undefined || v === null ? '' : v;
    }

    function buildRow(final) {
        const rows = jsPsych.data.get().values();
        // first_name / child_age are set on the welcome screen and stored as
        // dataset-wide properties, so they ride on every row jsPsych records.
        const props = jsPsych.data.get().values()[0] || {};
        const setup = window._lick4Setup || {};
        const row = {
            study: 'lick_4_game',
            participantId: PID,
            chsId: CHS,
            firstName: props.first_name || setup.first_name || '',
            childAge:  props.child_age  || setup.child_age  || '',
            relationCondition: (typeof CB_RELATION !== 'undefined') ? CB_RELATION : '',
            startedAt: startedAt,
            finishedAt: final ? new Date().toISOString() : '',
            // Final attempt wins: a child who gets it wrong hears the reminder
            // and is asked again, so the last answer is the one that counts.
            // attentionAttempts of 1 means they got it first time.
            attentionAnswer:  (() => {
                const a = rows.filter(r => r.name === 'attention_intro' || r.name === 'attention_retry');
                return a.length ? (a[a.length - 1].chosen_value ?? '') : '';
            })(),
            attentionCorrect: (() => {
                const a = rows.filter(r => r.name === 'attention_intro' || r.name === 'attention_retry');
                return a.length ? (a[a.length - 1].correct ?? '') : '';
            })(),
            attentionAttempts: rows.filter(r => r.name === 'attention_intro' || r.name === 'attention_retry').length,
            // Any question whose audio failed to start, e.g. "t3_okay_judgment".
            // Blank is the normal case; anything here means a child was asked a
            // question they never heard, and that trial should be treated with
            // suspicion.
            audioFailures: rows
                .filter(r => r.audio_played === false)
                .map(r => `t${(r.run_index ?? 0) + 1}_${r.name}`)
                .join(' '),
            userAgent: navigator.userAgent
        };
        let done = 0;
        for (let i = 0; i < NTRIALS; i++) {
            const anim = rows.find(r => r.name === 'trial_animation' && r.run_index === i);
            const p = `t${i + 1}_`;
            row[p + 'condition']       = anim ? anim.condition   : '';
            row[p + 'consent']         = anim ? anim.consent     : '';
            row[p + 'relation']        = anim ? anim.relation    : '';
            row[p + 'protagonist']     = anim ? anim.protagonist : '';
            row[p + 'replays']         = anim ? (anim.replay_count || 0) : '';
            row[p + 'memory']          = pick(rows, 'memory_check', i);
            row[p + 'memory_rt']       = pick(rows, 'memory_check', i, 'rt');
            row[p + 'okay']            = pick(rows, 'okay_judgment', i);
            row[p + 'okay_rt']         = pick(rows, 'okay_judgment', i, 'rt');
            // Certainty trials fold the yes/no direction into a 1-4 scale:
            // 4 = really okay, 3 = okay, 2 = not okay, 1 = really not okay.
            row[p + 'okayCert']        = pick(rows, 'okay_certainty', i, 'likert_numeric');
            row[p + 'okayCertLabel']   = pick(rows, 'okay_certainty', i, 'likert_label');
            row[p + 'protagInference'] = pick(rows, 'protagonist_inference', i);
            row[p + 'protagCert']      = pick(rows, 'protagonist_certainty', i, 'likert_numeric');
            row[p + 'protagCertLabel'] = pick(rows, 'protagonist_certainty', i, 'likert_label');
            if (row[p + 'okay'] !== '') done++;
        }
        row.nTrialsCompleted = done;
        return row;
    }

    function post(opts) {
        const final = !!(opts && opts.final);
        const row = buildRow(final);
        // Keep a local copy regardless, so data survives a failed upload.
        try { localStorage.setItem('lick4_' + PID, JSON.stringify(row)); } catch (e) {}
        if (!SHEETS_WEBHOOK || SHEETS_WEBHOOK.indexOf('PASTE_') === 0) {
            console.warn('[Sheets] webhook not configured — data kept locally only');
            return;
        }
        try {
            // text/plain avoids a CORS preflight; Apps Script reads postData.contents
            fetch(SHEETS_WEBHOOK, {
                method:  'POST',
                mode:    'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body:    JSON.stringify({ headers: COLS, row: row })
            }).catch(e => console.warn('[Sheets] post failed:', e));
        } catch (e) { console.warn('[Sheets] post threw:', e); }
    }

    // Tell the CHS shell tab we're done so it can stop recording and move on.
    function notifyOpener() {
        try {
            const target = (window.opener && window.opener !== window)
                ? window.opener : window.parent;
            if (target && target !== window) {
                target.postMessage({ type: 'GAME_COMPLETE', pid: PID }, '*');
            }
            if (window.opener && typeof window.opener.focus === 'function') {
                window.opener.focus();
            }
        } catch (e) { console.warn('GAME_COMPLETE postMessage failed:', e); }
    }

    function downloadCsv() {
        const row = buildRow(true);
        const esc = v => `"${String(v === undefined ? '' : v).replace(/"/g, '""')}"`;
        const csv = COLS.join(',') + '\n' + COLS.map(c => esc(row[c])).join(',');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = `lick4_${PID}.csv`;
        a.click();
    }

    return { post, notifyOpener, downloadCsv, buildRow, COLS, PID, CHS };
})();

// === STUDY CONSTANTS ===========================================
const CONDITIONS = ["Saliva", "Touch", "Prosocial"];
const CONSENTS   = ["Present", "Absent"];
const RELATIONS  = ["Mom", "Teacher"];
const CELL_NAMES = {
    "Prosocial_Present": "Jane",
    "Prosocial_Absent":  "Jasmine",
    "Saliva_Present":    "Jocelyn",
    "Saliva_Absent":     "Jenny",
    "Touch_Present":     "Jada",
    "Touch_Absent":      "Julia"
};

// === COUNTERBALANCING ==========================================
const CELLS = [];
for (const condition of CONDITIONS) {
    for (const consent of CONSENTS) {
        CELLS.push({ condition, consent });
    }
}
// Between-subjects: each child randomly assigned to Mom or Teacher.
// ====== RESEARCHER OPTIONS (URL params) =========================
//   ?rel=Mom|Teacher   force the between-subjects relation
//   ?skip_intro=1      skip welcome / fox_intro / pie_intro / attention_intro / button_training
//   ?trial=N           start at trial N (1-indexed; e.g. ?trial=4 skips the first 3)
//   ?audit=1           launch the asset audit screen instead of the study
//   ?dev=1             show floating dev panel + enable keyboard shortcuts
// Keyboard shortcuts, ?dev=1 ONLY (and never while typing in a field):
//   Shift+S            skip the current trial (finishTrial with {skipped:true})
//   Shift+E            end the whole study (jump to debrief)
// =================================================================
const DEV = (function() {
    const u = new URLSearchParams(window.location.search);
    return {
        rel:        u.get('rel'),
        skipIntro:  u.get('skip_intro') === '1',
        startTrial: Math.max(0, (parseInt(u.get('trial') || '1', 10) || 1) - 1),  // 0-indexed
        audit:      u.get('audit') === '1',
        dev:        u.get('dev') === '1' || u.get('audit') === '1',
    };
})();

const CB_RELATION = (function() {
    if (DEV.rel) {
        const m = RELATIONS.find(r => r.toLowerCase() === DEV.rel.toLowerCase());
        if (m) return m;
    }
    return jsPsych.randomization.sampleWithoutReplacement(RELATIONS, 1)[0];
})();
console.log("[LICK-4] CB_RELATION =", CB_RELATION, "DEV =", DEV);

// Researcher keyboard shortcuts: Shift+S skips a trial, Shift+E ends the study.
//
// These are gated behind ?dev=1 and ignored while a form field has focus. Both
// guards matter now that the welcome screen asks the child to type their first
// name: a child called Ella or Emmett types Shift+E and, without this, the whole
// session ends mid-typing. Shift+S is the same hazard for Sam or Sofia.
document.addEventListener('keydown', function(e) {
    if (!DEV.dev) return;
    if (!e.shiftKey) return;
    const el = e.target;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' ||
               el.tagName === 'SELECT' || el.isContentEditable)) return;
    if (e.key === 'S' || e.key === 's') {
        try { jsPsych.finishTrial({ skipped: true, skip_method: 'shift_s' }); } catch (_) {}
    } else if (e.key === 'E' || e.key === 'e') {
        try { jsPsych.endExperiment('Ended by researcher (Shift+E)'); } catch (_) {}
    }
});

const trial_order = jsPsych.randomization.shuffle([...Array(6).keys()]);

const TRIALS = trial_order.map((cell_idx, run_idx) => {
    const cell = CELLS[cell_idx];
    const key = `${cell.condition}_${cell.consent}`;
    return {
        run_index:  run_idx,
        cell_index: cell_idx,
        protagonist: CELL_NAMES[key],
        condition:  cell.condition,
        consent:    cell.consent,
        relation:   CB_RELATION
    };
});

jsPsych.data.addProperties({
    study: "lick_4_chs_replication_standalone_test",
    cb_relation: CB_RELATION,
    cb_trial_order: trial_order.join(","),
    cb_first_condition: TRIALS[0].condition,
    cb_first_consent:   TRIALS[0].consent
});

// === AUDIO + IMAGE PATHS =======================================
function trial_audio_path(t) {
    return `audio/trial_${t.condition.toLowerCase()}_${t.consent.toLowerCase()}_${t.relation.toLowerCase()}.mp3`;
}
const AUDIO = {
    q_certainty_ok:    "audio/q_certainty_ok.mp3",     // played after okay_judgment YES
    q_certainty_notok: "audio/q_certainty_notok.mp3",  // played after okay_judgment NO
    q_protag_certainty_ok:    "audio/q_protag_certainty_ok.mp3",     // protagonist_inference YES
    q_protag_certainty_notok: "audio/q_protag_certainty_notok.mp3",  // protagonist_inference NO
    pie_slice_first:    "audio/fox_pie_slice_first.mp3",
    pie_slice_more:     "audio/fox_pie_slice_more.mp3",
    pie_slice_more_yum: "audio/fox_pie_slice_more_yum.mp3",
    button_training:    "audio/fox_button_training.mp3",
    thanks:            "audio/thanks.mp3"
};
function _q_audio(kind, t) {
    return `audio/q_${kind}_${t.protagonist.toLowerCase()}_${t.relation.toLowerCase()}.mp3`;
}
function memory_audio(t)           { return _q_audio("memory", t); }
function okay_audio(t)             { return _q_audio("okay", t); }
function protagonist_okay_audio(t) { return _q_audio("protagonist_okay", t); }
function attention_audio(t)        { return _q_audio("attention", t); }
const CONDITION_SHORT = { Saliva: "sal", Touch: "tch", Prosocial: "pro" };
const CONSENT_SHORT   = { Present: "pres", Absent: "abs" };
function trial_video_path(t) {
    return `videos/${CONDITION_SHORT[t.condition]}_${CONSENT_SHORT[t.consent]}_${t.relation.toLowerCase()}.m4v`;
}
function trial_narration_audio_path(t) {
    return `audio/narration_${CONDITION_SHORT[t.condition]}_${CONSENT_SHORT[t.consent]}_${t.relation.toLowerCase()}.mp3`;
}

// === HELPERS ===================================================
// Persistent cute-fox narrator avatar in the bottom-right corner.
// Mouth animates ("talks") whenever any <audio> on the page is playing;
// idle (still) otherwise. Inline SVG so CSS can target the mouth element.
(function setupNarrator() {
    if (document.getElementById('lick4-narrator-container')) return;
    // Fox narrator artwork, sliced out of the rigged Character Animator puppet
    // (POW Studios) into flat PNGs — see charanim/ for the source PSD and the
    // export script. Three face plates (eyes open / mid-blink / shut) plus one
    // PNG per mouth shape, layered on top of the plate.
    const ART = "images/narrator/";

    // Whole-character frames, cut from the sprite sheet and chroma-keyed. The
    // old fox was a face plate with a mouth PNG layered on it; these are full
    // poses, so animation is a straight frame swap instead.
    // Six frames: three mouth openings, each with an eyes-open and an
    // eyes-shut version. All six are the SAME drawing with only the face
    // altered — measured at 0.0-0.2% difference across the ears and forehead —
    // so any frame can follow any other without the figure shifting.
    const FRAMES = {
        closed:       'fox_closed.png',        // mouth shut, slight smile
        mid:          'fox_mid.png',           // slightly open
        open:         'fox_open.png',          // wide open, tongue showing
        closed_blink: 'fox_closed_blink.png',
        mid_blink:    'fox_mid_blink.png',
        open_blink:   'fox_open_blink.png'
    };

    // Visemes collapse onto the three mouth openings the art has. Blinking is
    // a separate axis now: because every frame is the same drawing, she can
    // blink on any mouth shape, including mid-word.
    const WIDE_VISEMES = new Set(['Ah','Oh','WOo','Surprised']);
    const MID_VISEMES  = new Set(['Ee','Uh','R','L','F']);
    function frame_for(shape, speaking, blinking) {
        let mouth = 'closed';
        if (speaking) {
            if (WIDE_VISEMES.has(shape))     mouth = 'open';
            else if (MID_VISEMES.has(shape)) mouth = 'mid';
        }
        return blinking ? mouth + '_blink' : mouth;
    }

    Object.values(FRAMES).forEach(f => { const i = new Image(); i.src = ART + f; });

    const FOX_HTML = `<img class="fox-frame" src="${ART}${FRAMES.closed}" alt="">`;
    const css = `
        /* Portrait now — the fox is a full standing figure, not a head. */
        #lick4-narrator-container { position: fixed; right: 28px; top: 110px;
            bottom: auto; left: auto;
            width: 155px; height: 235px; z-index: 9; pointer-events: none;
            filter: drop-shadow(0 8px 18px rgba(0,0,0,0.20));
            transition: width 0.9s ease-in-out, height 0.9s ease-in-out,
                        right 0.9s ease-in-out, bottom 0.9s ease-in-out,
                        top   0.9s ease-in-out, left   0.9s ease-in-out,
                        margin-left 0.9s ease-in-out, margin-top 0.9s ease-in-out; }
        #lick4-narrator-container.hidden { display: none !important; }
        #lick4-narrator-container.intro-center {
            right: auto; bottom: auto; left: 50%; top: 50%;
            width: 266px; height: 402px;
            /* Sits above centre, not on it: these screens put a button below the
               fox, and dead-centring her made her overlap it. */
            margin-left: -133px; margin-top: -300px;
        }
        .fox-inner { position: relative; width: 100%; height: 100%; }
        .fox-inner .fox-frame {
            display: block; width: 100%; height: 100%; object-fit: contain;
        }
        #lick4-narrator-container.speaking .fox-inner { animation: fox-bob 1.4s ease-in-out infinite; }
        @keyframes fox-bob {
            0%,100% { transform: translateY(0)    rotate(-0.6deg); }
            50%     { transform: translateY(-3px) rotate( 0.6deg); }
        }
        /* Empty tin that fills with one crusted slice per completed trial.
           Bottom-LEFT: the fox now occupies the right side. */
        #lick4-pie {
            position: fixed; left: 28px; bottom: 28px; top: auto; right: auto; margin: 0;
            width: 130px; height: 130px; z-index: 9; pointer-events: none;
            opacity: 0;
            transition: right 1.2s ease-in-out, bottom 1.2s ease-in-out,
                        top 1.2s ease-in-out, left 1.2s ease-in-out,
                        margin-left 1.2s ease-in-out, margin-top 1.2s ease-in-out,
                        width 1.2s ease-in-out, height 1.2s ease-in-out,
                        transform 1.2s ease-in-out, opacity 0.4s ease-in-out;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.18));
        }
        #lick4-pie.visible { opacity: 1; }
        #lick4-pie .pie-plate     { fill: #f5efe3; }
        #lick4-pie .pie-tin-outer { fill: #8d5a28; }
        #lick4-pie .pie-tin-rim   { fill: #b9793d; }
        #lick4-pie .pie-tin-inner { fill: #e6d6bb; }
        #lick4-pie .pie-tin-lip   { fill: none; stroke: #8d5a28; stroke-width: 2; opacity: .35; }
        #lick4-pie .pie-slot {
            fill: none; stroke: #cbbb9c; stroke-width: 1.8; stroke-dasharray: 4 4;
            transition: opacity 0.4s ease-in-out;
        }
        #lick4-pie .pie-slice   { opacity: 0; transition: opacity 0.55s ease-in-out; }
        #lick4-pie .pie-fill    { fill: #eda945; }
        #lick4-pie .pie-crust   { fill: none; stroke: #a9601f; stroke-width: 8.5; stroke-linecap: round; }
        #lick4-pie .pie-edge    { fill: none; stroke: #cf8526; stroke-width: 1.3; }
        #lick4-pie .pie-lattice { stroke: #a9601f; stroke-width: 3.6; stroke-linecap: round; opacity: .7; }
        #lick4-pie .pie-steam   { opacity: 0; transition: opacity 0.9s ease-in-out 0.35s; }
        #lick4-pie .pie-steam path { fill: none; stroke: #b9ae9c; stroke-width: 3; stroke-linecap: round; }
        /* Per-count reveal rules are generated in JS (PIE_STATE_CSS). */
        #lick4-pie.feasting {
            opacity: 0;
            transition: transform 1.6s ease-in-out, opacity 1.6s ease-in-out 0.6s;
        }
        #lick4-pie.spotlight {
            right: auto; bottom: auto; left: 50%; top: 50%;
            margin-left: 200px; margin-top: -110px;
            width: 170px; height: 170px;
            filter: drop-shadow(0 8px 20px rgba(212,132,63,0.55));
            animation: pie-spotlight-wiggle 1.4s ease-in-out infinite;
        }
        @keyframes pie-spotlight-wiggle {
            0%,100% { transform: rotate(-4deg); }
            50%     { transform: rotate( 4deg); }
        }
        #lick4-pie.celebrating { animation: pie-celebrate 0.9s ease-in-out 2; }
        @keyframes pie-celebrate {
            0%,100% { transform: scale(1); }
            25%     { transform: scale(1.35) rotate(-8deg); }
            50%     { transform: scale(1.25) rotate( 6deg); }
            75%     { transform: scale(1.35) rotate(-4deg); }
        }
        @media (max-width: 900px) {
            #lick4-narrator-container { width: 105px; height: 159px; right: 12px; top: 80px; }
            #lick4-pie { width: 90px; height: 90px; left: 12px; bottom: 12px; }
        }
    `;
    // Plate + empty tin + six dashed slots + six crusted slices, plus steam
    // that only shows at 6 of 6. data-i lets the generated CSS reveal them
    // one at a time.
    function buildPieSVG() {
        const cx=60, cy=60, r=43;
        const ang = i => (i/6)*2*Math.PI - Math.PI/2;
        const px = (a,rad) => (cx + rad*Math.cos(a)).toFixed(1);
        const py = (a,rad) => (cy + rad*Math.sin(a)).toFixed(1);
        const wedge = i => `M ${cx},${cy} L ${px(ang(i),r)},${py(ang(i),r)} A ${r},${r} 0 0 1 ${px(ang(i+1),r)},${py(ang(i+1),r)} Z`;
        const crust = i => `M ${px(ang(i),r)},${py(ang(i),r)} A ${r},${r} 0 0 1 ${px(ang(i+1),r)},${py(ang(i+1),r)}`;
        let slots='', slices='';
        for (let i = 0; i < 6; i++) {
            slots += `<path class="pie-slot" data-i="${i}" d="${wedge(i)}"/>`;
            const m = ang(i+0.5);
            slices += `<g class="pie-slice" data-i="${i}">`
                + `<path class="pie-fill" d="${wedge(i)}"/>`
                + `<path class="pie-crust" d="${crust(i)}"/>`
                + `<path class="pie-edge" d="${wedge(i)}"/>`
                + `<line class="pie-lattice" x1="${px(m,13)}" y1="${py(m,13)}" x2="${px(m,36)}" y2="${py(m,36)}"/>`
                + `</g>`;
        }
        const steam = `<g class="pie-steam"><path d="M 46,12 q 7,-9 0,-15"/>`
            + `<path d="M 60,7 q 7,-10 0,-17"/><path d="M 74,12 q 7,-9 0,-15"/></g>`;
        return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <ellipse class="pie-plate" cx="60" cy="67" rx="57" ry="49"/>
            <circle class="pie-tin-outer" cx="60" cy="60" r="52"/>
            <circle class="pie-tin-rim" cx="60" cy="60" r="49"/>
            <circle class="pie-tin-inner" cx="60" cy="60" r="44"/>
            <circle class="pie-tin-lip" cx="60" cy="60" r="44"/>
            ${slots}${slices}${steam}</svg>`;
    }
    const PIE_SVG = buildPieSVG();

    // At data-done="d", slices 0..d-1 show and their slots hide. Generated so
    // the two halves can't drift apart.
    const PIE_STATE_CSS = (function() {
        let out = '';
        for (let d = 1; d <= 6; d++) {
            const on=[], off=[];
            for (let i = 0; i < d; i++) {
                on.push(`#lick4-pie[data-done="${d}"] .pie-slice[data-i="${i}"]`);
                off.push(`#lick4-pie[data-done="${d}"] .pie-slot[data-i="${i}"]`);
            }
            out += `${on.join(',')}{opacity:1}\n${off.join(',')}{opacity:0}\n`;
        }
        return out + `#lick4-pie[data-done="6"] .pie-steam{opacity:1}\n`;
    })();

    const ensureMounted = () => {
        let c = document.getElementById('lick4-narrator-container');
        if (!c) {
            c = document.createElement('div');
            c.id = 'lick4-narrator-container';
            // Start hidden — revealed on the directions/audio-check screen.
            if (!window._lick4FoxVisible) c.className = 'hidden';
            c.innerHTML = `<div class="fox-inner">${FOX_HTML}</div>`;
        }
        if (c.parentNode !== document.documentElement) document.documentElement.appendChild(c);
        let p = document.getElementById('lick4-pie');
        if (!p) {
            p = document.createElement('div');
            p.id = 'lick4-pie';
            p.setAttribute('data-done', String(window._lick4PieDone || 0));
            p.innerHTML = PIE_SVG;
        }
        if (p.parentNode !== document.documentElement) document.documentElement.appendChild(p);
        return c;
    };
    window.lick4_pie_advance = function() {
        window._lick4PieDone = Math.min(6, (window._lick4PieDone || 0) + 1);
        const p = document.getElementById('lick4-pie');
        if (p) p.setAttribute('data-done', String(window._lick4PieDone));
    };
    window.lick4_pie_feast = function() {
        const p = document.getElementById('lick4-pie');
        if (!p) return;
        // Fly the finished pie to wherever the fox actually is. Measured at
        // call time: the pie sits bottom-left and the fox top-right, and
        // either can shift with the viewport.
        const fox = document.getElementById('lick4-narrator-container');
        if (fox) {
            const a = p.getBoundingClientRect(), b = fox.getBoundingClientRect();
            const dx = (b.left + b.width/2) - (a.left + a.width/2);
            const dy = (b.top + b.height*0.62) - (a.top + a.height/2);
            p.style.transform = `translate(${dx.toFixed(0)}px, ${dy.toFixed(0)}px) scale(0.55)`;
        }
        p.classList.add('feasting');
    };
    const inject = () => {
        if (!document.getElementById('lick4-narrator-css')) {
            const s = document.createElement('style');
            s.id = 'lick4-narrator-css'; s.textContent = css + PIE_STATE_CSS;
            (document.head || document.documentElement).appendChild(s);
        }
        ensureMounted();

        // Pre-computed mouth-shape timelines, one per narration asset (every
        // audio clip and every trial video), built offline from each file's
        // loudness envelope — see charanim/ for the generator. Each track is a
        // string with one hex character per frame indexing into VISEMES. Keys
        // are repo-relative paths, matched with endsWith().
        let LIPSYNC = null;
        fetch(ART + "lipsync.json")
            .then(r => r.json())
            .then(j => { LIPSYNC = j; })
            .catch(() => { LIPSYNC = null; });   // falls back to a generic flap

        function trackFor(m) {
            if (!LIPSYNC) return null;
            const url = m.currentSrc || m.src || "";
            for (const k in LIPSYNC.tracks) if (url.endsWith(k)) return LIPSYNC.tracks[k];
            return null;
        }

        const FLAP = ['Ah','Ee','Neutral','Oh','Uh','Neutral'];

        function currentMouth() {
            let playing = null;
            document.querySelectorAll('audio, video').forEach(m => {
                if (!playing && !m.paused && !m.ended && m.readyState >= 2) playing = m;
            });
            if (!playing) return { shape: 'Neutral', speaking: false };
            const tl = trackFor(playing);
            if (tl) {
                const i = Math.floor(playing.currentTime * 1000 / LIPSYNC.frame_ms);
                if (i >= 0 && i < tl.length) {
                    return { shape: LIPSYNC.visemes[parseInt(tl[i], 16)], speaking: true };
                }
                return { shape: 'Neutral', speaking: true };
            }
            return { shape: FLAP[Math.floor(playing.currentTime * 8) % FLAP.length],
                     speaking: true };
        }

        // Blink every 2.5-6s, held ~140ms, whether or not she is talking —
        // every mouth shape has an eyes-shut twin.
        let blinking = false, blinkUntil = 0, nextBlink = performance.now() + 2500;
        function blinkTick(now) {
            if (blinking) {
                if (now >= blinkUntil) { blinking = false; nextBlink = now + 2500 + Math.random() * 3500; }
            } else if (now > nextBlink) {
                blinking = true;
                blinkUntil = now + 140;
            }
        }

        function tick(now) {
            const { shape, speaking } = currentMouth();
            blinkTick(now);
            const frame = frame_for(shape, speaking, blinking);
            // Re-query each frame: jsPsych can wipe and remount the container,
            // so state lives on the element rather than in captured vars.
            const box = document.getElementById('lick4-narrator-container');
            if (box) {
                const img = box.querySelector('.fox-frame');
                if (img && img.dataset.frame !== frame) {
                    img.src = ART + FRAMES[frame];
                    img.dataset.frame = frame;
                }
                box.classList.toggle('speaking', speaking);
            }
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        new MutationObserver(() => ensureMounted())
            .observe(document.documentElement, { childList: true, subtree: true });
    };
    if (document.documentElement) inject();
    else document.addEventListener('DOMContentLoaded', inject);
})();

function audio_html(src) {
    return `<audio autoplay class="narrator-audio"><source src="${src}" type="audio/mpeg"></audio>`;
}
function caption_banner(text) {
    return `<div style="font-size: 26px; color: #555; margin: 4px auto 18px auto; max-width: 900px; text-align: center; background: #f3efe6; border-radius: 8px; padding: 8px 18px; display: inline-block;">${text}</div>`;
}
function story_text(text) {
    return `<div style="max-width: 900px; margin: 22px auto; font-size: 30px; line-height: 1.35;">${text}</div>`;
}
function next_button(label = "Next") {
    return [`<p style="font-size: 36px; margin: 0;">${label}</p>`];
}
function render_trial_video(t, alt) {
    const path = trial_video_path(t);
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    return `<video src="${esc(path)}" data-path="${esc(path)}" autoplay playsinline data-trial-video style="max-width: 600px; height: auto; margin: 12px auto; display: block; border-radius: 6px;">Your browser does not support inline video. Expected at: ${esc(path)}</video>`;
}
function text_choice_box(text) {
    return `<div style="font-size: 40px; padding: 26px 40px; min-width: 220px; min-height: 60px; border: 4px solid #2a6f97; border-radius: 16px; background: #eaf4fb; line-height: 1.2;">${text}</div>`;
}
function thumb_choice_box(kind /* "up" | "down" */, label) {
    const isUp = kind === "up";
    const bg   = isUp ? "linear-gradient(135deg,#1e8449,#27AE60)" : "linear-gradient(135deg,#922b21,#C0392B)";
    const src  = isUp ? "images/thumbsup.png" : "images/thumbsdown.png";
    const lbl  = label || (isUp ? "Okay" : "Not Okay");
    return `<div style="background:${bg};color:white;padding:18px 28px;min-width:170px;border-radius:22px;font-size:22px;font-weight:700;line-height:1.2;text-align:center;"><img src="${src}" width="72" height="72" style="display:block;margin:0 auto 6px;">${lbl}</div>`;
}
function face_choice_box(img_src, caption) {
    return `<div style="padding:14px 18px;min-width:220px;border:4px solid #2a6f97;border-radius:18px;background:#eaf4fb;text-align:center;line-height:1.1;"><img src="${img_src}" alt="" style="display:block;margin:0 auto;width:200px;height:auto;border-radius:10px;background:#fff;"><div style="font-size:22px;font-weight:600;margin-top:10px;color:#1a3d5c;">${caption}</div></div>`;
}
// Hold the answer buttons back until the question has finished playing. A
// child who can click early answers a question they have not heard yet, and
// the data looks identical to a real answer. Everything is released on a
// timeout as well, so a clip that fails to play can't strand them.
function hold_until_spoken(audioEl, maxWaitMs) {
    const btns = () => Array.from(document.querySelectorAll('button.jspsych-btn'));
    const lock = () => btns().forEach(b => {
        b.disabled = true;
        b.style.opacity = '0.35';
        b.style.pointerEvents = 'none';
    });
    const release = () => btns().forEach(b => {
        b.disabled = false;
        b.style.opacity = '1';
        b.style.pointerEvents = '';
    });
    lock();
    let done = false;
    const once = () => { if (!done) { done = true; release(); } };
    if (audioEl) {
        audioEl.addEventListener('ended', once);
        audioEl.addEventListener('error', once);
    }
    // Fallback: the clip's own length once known, otherwise a flat ceiling.
    setTimeout(once, maxWaitMs || 9000);
    if (audioEl) {
        audioEl.addEventListener('loadedmetadata', () => {
            if (isFinite(audioEl.duration)) setTimeout(once, audioEl.duration * 1000 + 600);
        }, { once: true });
    }
    return release;
}

function two_option_trial({ stimulus_html, audio_key, audio_src, options, name, extra_data = {}, no_swap = false }) {
    let swap;
    return {
        type: jsPsychHtmlButtonResponse,
        on_start: function() { swap = no_swap ? false : (Math.random() < 0.5); },
        stimulus: function() {
            const src = audio_src || (audio_key ? AUDIO[audio_key] : null);
            const audio = src ? audio_html(src) : "";
            return audio + stimulus_html;
        },
        // `<audio autoplay>` is fire-and-forget: if the browser refuses to start
        // it, or the file is still loading, the child hears nothing, nobody is
        // told, and the trial looks fine in the data. Drive playback explicitly
        // instead, retry once, and record whether it actually played.
        on_load: function() {
            const a = document.querySelector('audio.narrator-audio');
            const trial = jsPsych.getCurrentTrial();
            if (!a) { if (trial) trial.data.audio_played = null; return; }
            let attempts = 0;
            const attempt = () => {
                attempts++;
                a.play().then(() => {
                    if (trial) { trial.data.audio_played = true; trial.data.audio_attempts = attempts; }
                }).catch(err => {
                    if (attempts < 2) { setTimeout(attempt, 350); return; }
                    if (trial) {
                        trial.data.audio_played = false;
                        trial.data.audio_attempts = attempts;
                        trial.data.audio_error = String(err && err.name || err);
                    }
                    console.warn('[LICK-4] question audio did not play:', a.currentSrc, err);
                });
            };
            if (a.readyState >= 2) attempt();
            else { a.addEventListener('canplay', attempt, { once: true }); setTimeout(attempt, 1200); }
            hold_until_spoken(a);
        },
        choices: function() {
            const ordered = swap ? [options[1], options[0]] : [options[0], options[1]];
            return ordered.map(o => o.label_html);
        },
        margin_horizontal: "30px",
        data: Object.assign({ name: name }, extra_data),
        on_finish: function(data) {
            const ordered = swap ? [options[1], options[0]] : [options[0], options[1]];
            const chosen = ordered[data.response];
            data.options_swapped = swap;
            data.chosen_value    = chosen.value;
            data.chosen_position = data.response === 0 ? "left" : "right";
            data.left_value      = ordered[0].value;
            data.right_value     = ordered[1].value;
        }
    };
}
function yes_no_trial({ stimulus_html, audio_key, audio_src, name, extra_data = {} }) {
    // Fixed layout: thumbs-up (Y) left, thumbs-down (N) right. Icons
    // are visually distinct so the L/R swap was only adding UX
    // confusion and risk of mis-clicks.
    return two_option_trial({
        stimulus_html, audio_key, audio_src, name, extra_data,
        no_swap: true,
        options: [
            { value: "Y", label_html: thumb_choice_box("up") },
            { value: "N", label_html: thumb_choice_box("down") }
        ]
    });
}
// 4-point Likert via RAD-style 2-step: YES/NO already asked, then
// "Was it really ok / just a little ok?" (or really-not-ok / just-a-little-
// not-ok) with two buttons coloured by the prior answer.
function okay_certainty_trial(extra_data, prior_name = "okay_judgment",
                              trial_name = "okay_certainty") {
    const certMap = {
        "DEFINITELY_YES": ["really_okay", 4],
        "MAYBE_YES":      ["okay",         3],
        "MAYBE_NO":       ["not_okay",     2],
        "DEFINITELY_NO":  ["really_not_okay", 1]
    };
    return {
        type: jsPsychHtmlButtonResponse,
        stimulus: function() {
            const prev = jsPsych.data.get().filter({name: prior_name}).last(1).values()[0];
            window._last_okay_isYes = prev && prev.chosen_value === "Y";
            const isYes = window._last_okay_isYes;
            const tag = isYes
                ? '<span style="background:linear-gradient(135deg,#56ab2f,#a8e063);color:white;padding:4px 16px;border-radius:18px;font-size:26px;display:inline-block;">okay</span>'
                : '<span style="background:linear-gradient(135deg,#eb3349,#f45c43);color:white;padding:4px 16px;border-radius:18px;font-size:26px;display:inline-block;">not okay</span>';
            const isProtag = (prior_name === "protagonist_inference");
            const certAudio = isProtag
                ? (isYes ? AUDIO.q_protag_certainty_ok : AUDIO.q_protag_certainty_notok)
                : (isYes ? AUDIO.q_certainty_ok        : AUDIO.q_certainty_notok);
            const youSaid = isProtag ? "She would say" : "You said";
            return audio_html(certAudio) + story_text(`${youSaid} ${tag}.`);
        },
        choices: function() {
            const isYes = window._last_okay_isYes;
            const thumbSrc = isYes ? "images/thumbsup.png" : "images/thumbsdown.png";
            const strongBg = isYes ? "linear-gradient(135deg,#1e8449,#27AE60)" : "linear-gradient(135deg,#922b21,#C0392B)";
            const mildBg = isYes ? "linear-gradient(135deg,#a8e063,#d0f5a0)" : "linear-gradient(135deg,#f45c43,#ffbdad)";
            const mildColor = isYes ? "#1a5e2a" : "#7B241C";
            const strongLabel = isYes ? "Really<br>OK!"   : "Really<br>NOT OK!";
            const mildLabel   = isYes ? "Just a little<br>ok" : "Just a little<br>not ok";
            return [
                `<div style="background:${strongBg};color:white;padding:20px 22px;min-width:180px;border-radius:22px;font-size:22px;font-weight:600;line-height:1.25;"><img src="${thumbSrc}" width="54" height="54" style="display:block;margin:0 auto 6px;">${strongLabel}</div>`,
                `<div style="background:${mildBg};color:${mildColor};padding:18px 18px;min-width:160px;border-radius:22px;font-size:18px;font-weight:600;line-height:1.25;"><img src="${thumbSrc}" width="36" height="36" style="display:block;margin:0 auto 4px;">${mildLabel}</div>`
            ];
        },
        margin_horizontal: "16px",
        data: Object.assign({ name: trial_name, prior_name: prior_name }, extra_data),
        on_load: function() {
            hold_until_spoken(document.querySelector('audio.narrator-audio'));
        },
        on_finish: function(data) {
            const isYes = window._last_okay_isYes;
            const cert = data.response === 0 ? "DEFINITELY" : "MAYBE";
            const combined = cert + (isYes ? "_YES" : "_NO");
            data.certainty = cert;
            data.combined = combined;
            data.likert_label = certMap[combined][0];
            data.likert_numeric = certMap[combined][1];
            data.initial_yes_no = isYes ? "Y" : "N";
        }
    };
}

// === TRIAL FACTORY =============================================
function side_character_label(t) { return `${t.protagonist}'s ${t.relation.toLowerCase()}`; }
function instrument_label(t)     { return t.condition === "Touch" ? "drumstick" : "kazoo"; }
function action_verb(t)          { return t.condition === "Saliva" ? "play" : (t.condition === "Touch" ? "use" : "touch"); }
function action_verb_past(t)     { return t.condition === "Saliva" ? "played" : (t.condition === "Touch" ? "used" : "touched"); }
// Sound effects are now baked into the trial videos.

function trial_narration(t) {
    const inst    = instrument_label(t);
    const playing = t.condition === "Touch" ? "drum" : "kazoo";
    const rel     = t.relation.toLowerCase();
    const name    = t.protagonist;
    const opener  = `Here's <b>${name}</b>. The person standing next to ${name} is <b>${name}'s ${rel}</b>. ${name} is playing her ${playing}.`;
    if (t.condition === "Prosocial") {
        if (t.consent === "Absent") return `${opener} ${name} leaves. While ${name} is gone, the wind knocks over ${name}'s ${inst}, and ${name}'s ${rel} puts it back. ${name} comes back and plays her ${inst} again.`;
        return `${opener} The wind knocks over ${name}'s ${inst}. ${name}'s ${rel} puts it back. ${name} plays her ${inst} again.`;
    }
    if (t.condition === "Saliva") {
        if (t.consent === "Absent") return `${opener} ${name} leaves. While ${name} is gone, ${name}'s ${rel} plays ${name}'s ${inst}. ${name} comes back and plays her ${inst} again.`;
        return `${opener} ${name} gives her ${inst} to her ${rel}. ${name}'s ${rel} plays ${name}'s ${inst}. She gives it back, and ${name} plays her ${inst} again.`;
    }
    if (t.consent === "Absent") return `${opener} ${name} leaves. While ${name} is gone, ${name}'s ${rel} uses ${name}'s ${inst}. ${name} comes back and uses her ${inst} again.`;
    return `${opener} ${name} gives her ${inst} to her ${rel}. ${name}'s ${rel} uses ${name}'s ${inst}. She gives it back, and ${name} uses her ${inst} again.`;
}

function build_test_trial(t) {
    const sub = [];
    const them = side_character_label(t);
    const inst = instrument_label(t);

    sub.push({
        type: jsPsychHtmlButtonResponse,
        // No "Trial X of 6" banner or watching indicator — pie widget shows progress.
        stimulus: render_trial_video(t, `${t.protagonist} and her ${t.relation.toLowerCase()} with a ${inst}`),
        choices: [
            `<div style="background:linear-gradient(135deg,#ff9436,#ed6b00);color:white;padding:14px 30px;border-radius:16px;font-weight:700;font-size:26px;display:inline-flex;align-items:center;gap:10px;line-height:1;box-shadow:0 4px 10px rgba(237,107,0,0.30);"><span style="font-size:34px;line-height:0.8;">↻</span> Watch again</div>`,
            `<div style="background:linear-gradient(135deg,#34d058,#1e8449);color:white;padding:14px 30px;border-radius:16px;font-weight:700;font-size:26px;display:inline-flex;align-items:center;gap:10px;line-height:1;box-shadow:0 4px 10px rgba(39,174,96,0.30);">Next <span style="font-size:28px;line-height:0.8;">▶</span></div>`
        ],
        button_html: '<button class="jspsych-btn" style="background:transparent;border:none;padding:0;margin:0 10px;">%choice%</button>',
        data: { name: "trial_animation", run_index: t.run_index, cell_index: t.cell_index, protagonist: t.protagonist, condition: t.condition, consent: t.consent, relation: t.relation },
        on_load: function() {
            const video = document.querySelector('video[data-trial-video]');
            const oldReplay = document.querySelectorAll('button.jspsych-btn')[0];
            const newReplay = oldReplay.cloneNode(true);
            oldReplay.parentNode.replaceChild(newReplay, oldReplay);
            const getBtns = () => document.querySelectorAll('button.jspsych-btn');
            const hide = () => getBtns().forEach(b => { b.disabled = true;  b.style.visibility = "hidden";  });
            const show = () => getBtns().forEach(b => { b.disabled = false; b.style.visibility = "visible"; });
            newReplay.addEventListener('click', function(e) {
                e.preventDefault(); e.stopPropagation();
                if (newReplay.disabled) return;
                video.currentTime = 0; video.play().catch(()=>{});
                hide();
                const td = jsPsych.getCurrentTrial().data;
                td.replay_count = (td.replay_count || 0) + 1;
            });
            video.addEventListener('ended', show);
            video.play().catch(() => {});
            hide();
        }
    });

    // Face-button captions: relation capitalized ("Mom's kazoo").
    const own_label    = `Her own ${inst}`;
    const target_label = `${t.protagonist}'s ${inst}`;
    const verb         = action_verb(t);
    const _kid_src     = `images/faces/${t.protagonist.toLowerCase()}.png`;
    const _adult_src   = `images/faces/${t.protagonist.toLowerCase()}_adult.png`;
    sub.push(two_option_trial({
        audio_src: memory_audio(t),
        stimulus_html: "",
        options: [
            { value: "protagonist", label_html: face_choice_box(_kid_src,   target_label) },
            { value: "own",         label_html: face_choice_box(_adult_src, own_label) }
        ],
        name: "memory_check",
        extra_data: { run_index: t.run_index, cell_index: t.cell_index, protagonist: t.protagonist, condition: t.condition, consent: t.consent, relation: t.relation }
    }));

    sub.push(yes_no_trial({
        audio_src: okay_audio(t),
        stimulus_html: "",
        name: "okay_judgment",
        extra_data: { run_index: t.run_index, cell_index: t.cell_index, protagonist: t.protagonist, condition: t.condition, consent: t.consent, relation: t.relation }
    }));

    sub.push(okay_certainty_trial({ run_index: t.run_index, cell_index: t.cell_index, protagonist: t.protagonist, condition: t.condition, consent: t.consent, relation: t.relation }));

    if (t.consent === "Absent") {
        sub.push(yes_no_trial({
            audio_src: protagonist_okay_audio(t),
            stimulus_html: "",
            name: "protagonist_inference",
            extra_data: { run_index: t.run_index, cell_index: t.cell_index, protagonist: t.protagonist, condition: t.condition, consent: t.consent, relation: t.relation }
        }));
        sub.push(okay_certainty_trial(
            { run_index: t.run_index, cell_index: t.cell_index, protagonist: t.protagonist, condition: t.condition, consent: t.consent, relation: t.relation },
            "protagonist_inference",
            "protagonist_certainty"
        ));
    }

    // Per-trial attention check removed — manipulation is checked
    // once at the start (after the attention_intro video).

    // Pie-slice celebration — fox says "thanks, we got a piece of pie!"
    // and the pie fills in one wedge with a wiggle.
    sub.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: function() {
            const done = window._lick4PieDone || 0;
            let src;
            if (done === 0)         src = AUDIO.pie_slice_first;

// Start-of-study attention check: plays the intro video establishing
// the assigned relationship. Single Next button (locked until video
// ends) — no mom/teacher quiz any more.
// === SPOKEN-LABEL BUTTON CUES ==================================
// The attention check labels its buttons "Mom" and "Teacher" in text, which
// assumes a 6-year-old can read. Shaking the matching button while the word is
// spoken links the sound to the button instead.
//
// To shake on the actual words, add the time in seconds at which each word is
// spoken. Left empty, the buttons are offered one at a time after the question
// finishes, which needs no alignment. Times are seconds into the clip.
// Word onsets in "…the girl's mom, or the girl's teacher?", checked by ear
// against clipped spans of the audio. "mom" is the loud cluster before the
// comma pause at 6.78–7.05; "teacher" closes the sentence.
const WORD_CUES = {
    "audio/q_attention_intro.mp3": { Mom: 6.45, Teacher: 7.50 },
};

// Fire each cue as its word is spoken. Animation frames give frame-accurate
// timing, but they stop in a backgrounded tab — so timeupdate (~4x a second)
// backs them up. Both drain one shared queue, so each cue fires exactly once
// whichever gets there first.
function scheduleCues(audioEl, cues) {
    const pending = Object.keys(cues)
        .map(label => ({ label, at: cues[label] }))
        .sort((a, b) => a.at - b.at);
    const drain = () => {
        while (pending.length && audioEl.currentTime >= pending[0].at) {
            cueLabel(pending.shift().label);
        }
        return pending.length === 0;
    };
    (function poll() {
        if (audioEl.ended || !audioEl.isConnected || drain()) return;
        requestAnimationFrame(poll);
    })();
    audioEl.addEventListener('timeupdate', function tu() {
        if (drain()) audioEl.removeEventListener('timeupdate', tu);
    });
}

(function injectCueCss() {
    if (document.getElementById('lick4-cue-css')) return;
    const s = document.createElement('style');
    s.id = 'lick4-cue-css';
    s.textContent = `
        @keyframes lick4-cue-shake {
            0%,100% { transform: translateX(0)   rotate(0deg)   scale(1); }
            15%     { transform: translateX(-6px) rotate(-2.5deg) scale(1.06); }
            35%     { transform: translateX(6px)  rotate(2.5deg)  scale(1.08); }
            55%     { transform: translateX(-5px) rotate(-2deg)   scale(1.06); }
            75%     { transform: translateX(4px)  rotate(1.5deg)  scale(1.04); }
        }
        button.jspsych-btn.lick4-cued { animation: lick4-cue-shake 0.72s ease-in-out; }
        button.jspsych-btn.lick4-cued > div { box-shadow: 0 0 0 5px rgba(255,180,60,0.55); }
    `;
    (document.head || document.documentElement).appendChild(s);
})();

// Shake the button whose visible text matches `label`. Matching on text rather
// than index matters: the two buttons are presented in randomised order.
function cueLabel(label) {
    const want = String(label).trim().toLowerCase();
    document.querySelectorAll('button.jspsych-btn').forEach(b => {
        if ((b.textContent || '').trim().toLowerCase() !== want) return;
        b.classList.remove('lick4-cued');
        void b.offsetWidth;                 // restart the animation
        b.classList.add('lick4-cued');
        setTimeout(() => b.classList.remove('lick4-cued'), 900);
    });
}

// Play an audio file, in the document so the fox lip-syncs to it, and unlock
// the buttons once it finishes.
function play_and_unlock(src, cls) {
    const a = document.createElement('audio');
    a.src = src;
    a.className = cls;

// watch today, the person next to the girl is her mom"), then ask again. Uses
// the reminder recording rather than replaying the whole intro video, so a
// child who simply mis-clicked isn't made to sit through it again.
const attention_retry = {
    type: jsPsychHtmlButtonResponse,
    on_start: function() { window._attn_intro_swap = Math.random() < 0.5; },
    stimulus: `<div style="height: 300px;"></div>`,
    choices: attention_choices,

        const reminder = CB_RELATION === "Mom"
            ? "audio/attention_intro_mom.mp3"
            : "audio/attention_intro_teacher.mp3";
        const a = play_and_unlock(reminder, 'attn-reminder-audio');

// Repeats the reminder + question until they get it right, capped so a child
// who keeps guessing isn't stuck. attentionCorrect in the data reflects the
// final attempt; attentionAttempts records how many it took.
const attention_retry_loop = {
    timeline: [attention_retry],
    conditional_function: function() { return window._attn_last_correct === false; },
    loop_function: function() {
        return window._attn_last_correct === false
            && window._attn_attempts <= MAX_ATTENTION_RETRIES;

};

        "audio/thanks.mp3",
    ];
    // Per-trial question audios — for ALL relations (so audit covers both flows).
    for (const t of TRIALS) {
        const n = t.protagonist.toLowerCase();
        for (const r of ["mom", "teacher"]) {
            audios.push(`audio/q_memory_${n}_${r}.mp3`);

            if (t.consent === "Absent") audios.push(`audio/q_protagonist_okay_${n}_${r}.mp3`);
        }
    }
    const videos = [
        "videos/girls_mom_intro.m4v", "videos/girls_teacher_intro.m4v",
        ...TRIALS.map(trial_video_path),
    ];
    const images = [
        "images/thumbsup.png", "images/thumbsdown.png",
        ...TRIALS.flatMap(t => {
            const n = t.protagonist.toLowerCase();
            return [`images/faces/${n}.png`, `images/faces/${n}_adult.png`];
        }),
    ];
    return { audios: [...new Set(audios)], videos: [...new Set(videos)], images: [...new Set(images)] };
}

const audit_screen = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div style="max-width: 900px; margin: 0 auto; text-align: left;">
        <h2 style="font-family: -apple-system, sans-serif;">Asset Audit</h2>
        <p id="audit-status" style="color:#666;">Loading…</p>
        <div id="audit-results" style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; max-height: 60vh; overflow-y: auto; border: 1px solid #ddd; padding: 10px; background: #fafafa;"></div>
        <p style="color:#888;font-size:12px;margin-top:8px;">Click <b>Continue</b> to start the study, or close this tab. Add <code>?skip_intro=1</code> to jump straight to trials.</p>
    </div>`,
    choices: ["Continue to study"],
    on_load: async function() {
        const out = document.getElementById('audit-results');
        const status = document.getElementById('audit-status');
        const assets = buildAuditAssetList();
        const all = [
            ...assets.audios.map(p => ({ p, type: "audio" })),
            ...assets.videos.map(p => ({ p, type: "video" })),
            ...assets.images.map(p => ({ p, type: "image" })),
        ];
        out.innerHTML = all.map((a, i) =>
            `<div id="aud-${i}" style="padding:1px 0;">⏳ <b>${a.type}</b> ${a.p}</div>`
        ).join('');

        // Use element-load checks (work on file:// URLs unlike fetch HEAD).
        function checkOne(asset, idx) {
            return new Promise(resolve => {
                let el;
                if (asset.type === 'image') el = new Image();
                else                         el = document.createElement(asset.type); // audio/video
                let done = false;
                const ok = () => { if (!done) { done = true; resolve(true); } };
                const fail = () => { if (!done) { done = true; resolve(false); } };
                if (asset.type === 'image') {
                    el.onload = ok; el.onerror = fail; el.src = asset.p;
                } else {
                    el.addEventListener('loadedmetadata', ok);
                    el.addEventListener('canplay', ok);
                    el.addEventListener('error', fail);
                    el.preload = 'metadata';
                    el.src = asset.p;
                    el.load();
                }
                setTimeout(fail, 8000);  // hard timeout
            });
        }

        let okCount = 0, missCount = 0;
        await Promise.all(all.map(async (a, i) => {
            const row = document.getElementById(`aud-${i}`);
            const ok = await checkOne(a, i);
            if (ok) {
                okCount++;
                row.innerHTML = `✅ <b>${a.type}</b> ${a.p}`;
                row.style.color = '#1a7a2c';
            } else {
                missCount++;
                row.innerHTML = `❌ <b>${a.type}</b> ${a.p}`;
                row.style.color = '#b00020';
                row.style.fontWeight = '600';
            }
            status.innerHTML = `<b>${okCount}</b> OK · <b style="color:${missCount?'#b00020':'#999'};">${missCount}</b> missing · ${all.length} total`;
        }));
        // Move missing items to the top for easy scanning
        const items = Array.from(out.children);
        items.sort((a, b) => {
            const am = a.textContent.startsWith('❌') ? 0 : 1;
            const bm = b.textContent.startsWith('❌') ? 0 : 1;
            return am - bm;
        }).forEach(el => out.appendChild(el));
        status.innerHTML += missCount === 0
            ? ' &nbsp; — <span style="color:#1a7a2c;">All assets present.</span>'
            : ' &nbsp; — <span style="color:#b00020;font-weight:600;">Some assets missing — fix before deploying.</span>';
    },
    data: { name: "audit_screen" }
};

// === DEV PANEL ==================================================
// Floating info widget visible when ?dev=1. Shows current relation,
// study state, and offers quick skip / end-study buttons.
function mountDevPanel() {
    if (!DEV.dev) return;
    if (document.getElementById('lick4-dev-panel')) return;
    const p = document.createElement('div');
    p.id = 'lick4-dev-panel';
    p.innerHTML = `
        <div style="font-weight:700;margin-bottom:4px;">DEV PANEL</div>
        <div>Relation: <b>${CB_RELATION}</b></div>
        <div id="dev-current-trial" style="color:#aaa;">(starting…)</div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
            <button data-dev="skip">Skip trial</button>
            <button data-dev="end">End study</button>
        </div>
        <div style="margin-top:6px;color:#aaa;font-size:10px;">Shift+S = skip · Shift+E = end</div>`;
    p.style.cssText = `position: fixed; left: 18px; bottom: 18px; z-index: 99;
        background: rgba(20,20,28,0.92); color: white;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        padding: 10px 14px; border-radius: 8px; min-width: 200px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.4); pointer-events: auto;`;
    document.documentElement.appendChild(p);
    p.querySelector('[data-dev="skip"]').onclick = () => {
        try { jsPsych.finishTrial({ skipped: true, skip_method: 'dev_panel' }); } catch (_) {}
    };
    p.querySelector('[data-dev="end"]').onclick = () => {
        try { jsPsych.endExperiment('Ended via dev panel'); } catch (_) {}
    };
    // Update current trial label every 500ms
    setInterval(() => {
        try {
            const td = jsPsych.getCurrentTrial();
            const lbl = document.getElementById('dev-current-trial');
            if (lbl && td && td.data) {
                lbl.textContent = `Trial: ${td.data.name || '(unnamed)'}` +
                    (td.data.protagonist ? ` · ${td.data.protagonist}/${td.data.condition}/${td.data.consent}` : '');
            }
        } catch (_) {}
    }, 500);
}

const thanks = {
    type: jsPsychHtmlButtonResponse,
    stimulus: audio_html(AUDIO.thanks)
        + `<p style="font-size: 44px; margin: 40px auto; line-height: 1.3;">Thank you for playing!</p>`,
    choices: next_button("All done!"),
    data: { name: "thanks" },
    on_load: function() {
        if (typeof window.lick4_pie_feast === "function") {
            setTimeout(window.lick4_pie_feast, 600);
        }
    }
};

// Final screen. Saves the completed row and tells the CHS tab we're done
// BEFORE offering any way to leave — the tab can be closed from here, and a
// close that beat the upload would lose the whole session.
const return_to_chs = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
        <div style="max-width: 640px; margin: 40px auto; text-align: center;">
            <p style="font-size: 40px; margin: 0 0 18px;">🦊 All done — thank you!</p>
            <p style="font-size: 26px; line-height: 1.4; color: #444;">
                Grown-ups: please go back to the <b>Children Helping Science</b> tab
                to finish up.
            </p>
            <p id="lick4-return-note" style="font-size: 20px; color: #777; margin-top: 22px;">
                That tab should have moved on by itself already.
            </p>
        </div>`,
    choices: ["Take me back to the study"],
    data: { name: "return_to_chs" },
    on_load: function() {
        // 1. Save first. 2. Then hand off to CHS. Order matters.
        try { SHEETS.post({ final: true }); } catch (e) { console.warn(e); }
        try { SHEETS.notifyOpener(); }        catch (e) { console.warn(e); }

        // If we weren't opened by CHS (direct pilot run) there's nothing to go
        // back to, so don't offer a button that does nothing.
        const opened = !!(window.opener && window.opener !== window);
        if (!opened) {
            document.querySelectorAll('button.jspsych-btn')
                    .forEach(b => { b.style.display = 'none'; });
            const note = document.getElementById('lick4-return-note');
            if (note) note.textContent = 'You can close this tab.';
        }
    },
    on_finish: function() {
        // Focus the CHS tab, then close this one. Both are permitted here
        // because this tab was opened by script from that tab.
        try {
            if (window.opener && !window.opener.closed) {
                window.opener.focus();
                setTimeout(() => window.close(), 150);
            }
        } catch (e) { console.warn('could not return to the CHS tab:', e); }
    }
};

// === TIMELINE ==================================================
timeline.push(preload);

if (DEV.audit) {
    // Asset audit mode — verify all files load, then end.
    timeline.push(audit_screen);
} else {
    timeline.push(welcome);
    if (!DEV.skipIntro) {
        timeline.push(fox_intro);
        timeline.push(pie_intro);
        timeline.push(intro);
        timeline.push(attention_intro);
        timeline.push(attention_retry_loop);
        timeline.push(button_training);
    }
    timeline.push(transition_to_trials);
    // ?trial=N skips the first N-1 trials (1-indexed in URL, 0-indexed internally).
    const trialsToRun = TRIALS.slice(DEV.startTrial);
    if (DEV.startTrial > 0) {
        console.log(`[LICK-4] DEV: starting at trial ${DEV.startTrial + 1} of ${TRIALS.length}`);
    }
    for (const t of trialsToRun) {
        for (const frame of build_test_trial(t)) {
            timeline.push(frame);
        }
    }
    timeline.push(thanks);
    timeline.push(return_to_chs);
}

mountDevPanel();
jsPsych.run(timeline);
</script>
</html>
